<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VSDTL IDE</title>

<style>
:root {
  --bg:        #0d1117;
  --bg-alt:    #161b22;
  --border:    #30363d;
  --text:      #c9d1d9;
  --text-dim:  #8b949e;
  --blue:      #79c0ff;
  --green:     #7ee787;
  --yellow:    #e3b341;
  --purple:    #d2a8ff;
  --run-bg:    #238636;
  --run-bg-h:  #2ea043;
  --clear-bg:  #21262d;
  --clear-bd:  #30363d;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
  color: var(--text);
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* Header */
#header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text);
}

#title .accent { color: var(--blue); }

#headerActions {
  display: flex;
  gap: 8px;
}

button {
  font-family: inherit;
  font-size: 13px;
  border: none;
  border-radius: 6px;
  padding: 7px 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}

#runBtn {
  background: var(--run-bg);
  color: #fff;
}
#runBtn:hover { background: var(--run-bg-h); }

#clearBtn {
  background: var(--clear-bg);
  color: var(--text);
  border: 1px solid var(--clear-bd);
}
#clearBtn:hover { background: #30363d; }

/* Editor stack */
#editorWrap {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

#editor {
  position: absolute;
  inset: 0;
  background: transparent;
  color: transparent;
  caret-color: var(--text);
  border: none;
  outline: none;
  padding: 16px;
  font-family: inherit;
  font-size: 14px;
  resize: none;
  line-height: 1.6;
  white-space: pre-wrap;
  word-wrap: break-word;
  z-index: 1;
}

#highlight {
  position: absolute;
  inset: 0;
  pointer-events: none;
  padding: 16px;
  font-family: inherit;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-wrap: break-word;
  overflow: auto;
  z-index: 0;
}

/* Output */
#outputBar {
  display: flex;
  align-items: center;
  padding: 6px 16px;
  background: var(--bg-alt);
  border-top: 1px solid var(--border);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
  flex-shrink: 0;
}

#output {
  height: 28%;
  min-height: 100px;
  background: var(--bg);
  padding: 12px 16px;
  overflow-y: auto;
  white-space: pre-wrap;
  font-size: 13px;
  flex-shrink: 0;
}

/* Prompt */
#prompt {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px 16px;
  background: var(--bg-alt);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

#prompt .prefix {
  color: var(--green);
  font-weight: 700;
  flex-shrink: 0;
}

#cmd {
  flex: 1;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  outline: none;
  padding: 8px 14px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 13px;
}
#cmd:focus { border-color: var(--blue); }

#sendBtn {
  background: var(--clear-bg);
  color: var(--text);
  border: 1px solid var(--clear-bd);
  padding: 7px 14px;
}
#sendBtn:hover { background: #30363d; }

/* Syntax colors */
.blue   { color: var(--blue); }
.green  { color: var(--green); }
.yellow { color: var(--yellow); }
.purple { color: var(--purple); }
.error  { color: #f85149; }
</style>
</head>

<body>

<div id="app">

  <div id="header">
    <div id="title"><span class="accent">VSDTL</span> IDE</div>
    <div id="headerActions">
      <button id="clearBtn" onclick="clearAll()">Clear</button>
      <button id="runBtn" onclick="runFile()">▶ Run</button>
    </div>
  </div>

  <div id="editorWrap">
    <pre id="highlight"></pre>
    <textarea id="editor" spellcheck="false"
      placeholder="Write VSDTL here...&#10;&#10;@users = [&#34;Alice&#34;,&#34;Bob&#34;]&#10;Display(#users)"></textarea>
  </div>

  <div id="outputBar">Output</div>
  <div id="output"></div>

  <div id="prompt">
    <span class="prefix">&gt;</span>
    <input id="cmd" placeholder='Insert(table) | Add(table,"x") | Display(#table)'
      onkeydown="if(event.key==='Enter')runCommand()">
    <button id="sendBtn" onclick="runCommand()">▶</button>
  </div>

</div>

<script>
const editor   = document.getElementById("editor");
const highlight = document.getElementById("highlight");
const output    = document.getElementById("output");
const cmd       = document.getElementById("cmd");

let tables = {};

/* ---------- HELPERS ---------- */

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ---------- SYNTAX HIGHLIGHTING ---------- */

editor.addEventListener("input", updateHighlight);
editor.addEventListener("scroll", () => {
  highlight.scrollTop = editor.scrollTop;
  highlight.scrollLeft = editor.scrollLeft;
});

function updateHighlight() {
  highlight.innerHTML = tokenize(editor.value);
}

function tokenize(src) {
  let out = "";
  let token = "";
  let inString = false;

  const flush = () => {
    out += colorToken(token);
    token = "";
  };

  for (const ch of src) {
    if (inString) {
      token += ch;
      if (ch === '"') { flush(); inString = false; }
    } else if (ch === '"') {
      flush();
      inString = true;
      token = '"';
    } else if (" \n=(),".includes(ch)) {
      flush();
      out += ch === "\n" ? "\n" : escapeHtml(ch);
    } else {
      token += ch;
    }
  }
  flush();
  return out;
}

function colorToken(tok) {
  if (!tok) return "";
  const esc = escapeHtml(tok);
  if (tok === "Display") return `<span class="yellow">${esc}</span>`;
  if (tok.startsWith("@")) return `<span class="blue">${esc}</span>`;
  if (tok.startsWith("#")) return `<span class="purple">${esc}</span>`;
  if (/^".*"$/.test(tok)) return `<span class="green">${esc}</span>`;
  return esc;
}

/* ---------- FILE RUNNER ---------- */

function runFile() {
  output.textContent = "";
  tables = {};

  const start = performance.now();
  const lines = editor.value.split("\n");

  try {
    for (const line of lines) execLine(line.trim());
  } catch (e) {
    output.textContent += "Runtime error: " + e.message + "\n";
  }

  const ms = (performance.now() - start).toFixed(2);
  output.textContent += `\nExecuted in ${ms} ms\n`;
}

function clearAll() {
  editor.value = "";
  output.textContent = "";
  tables = {};
  updateHighlight();
  editor.focus();
}

function execLine(line) {
  if (!line) return;

  if (line.startsWith("@")) {
    const eqIdx = line.indexOf("=");
    if (eqIdx === -1) throw new Error("Invalid table definition: missing '=' in '" + line + "'");
    const n = line.slice(1, eqIdx).trim();
    const v = line.slice(eqIdx + 1).trim();
    tables[n] = JSON.parse(v);
  }
  else if (line.startsWith("Display")) {
    const t = line.match(/#(\w+)/)?.[1];
    if (!t) throw new Error("Display requires a table reference: Display(#name)");
    if (!tables[t]) {
      output.textContent += `Table "${t}" is empty or not defined\n`;
      return;
    }
    output.textContent += tables[t].join(", ") + "\n";
  }
}

/* ---------- COMMAND PROMPT ---------- */

function runCommand() {
  const c = cmd.value.trim();
  if (!c) return;
  cmd.value = "";

  let match;

  if (match = c.match(/^Insert\((.+)\)$/)) {
    const n = match[1].trim();
    tables[n] = [];
    const re = new RegExp("@" + n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*=\\s*.*");
    if (re.test(editor.value)) {
      editor.value = editor.value.replace(re, "@" + n + " = []");
    } else {
      editor.value += (editor.value && !editor.value.endsWith("\n") ? "\n" : "") + "@" + n + " = []";
    }
    updateHighlight();
  }

  else if (match = c.match(/^Add\((.+)\)$/)) {
    const body = match[1];
    const commaIdx = body.indexOf(",");
    if (commaIdx === -1) {
      output.textContent += "Add requires at least one value: Add(table,\"value\")\n";
      return;
    }
    const name = body.slice(0, commaIdx).trim();
    const vals = body.slice(commaIdx + 1).match(/"[^"]+"/g)
      ?.map(v => v.replace(/"/g, "")) || [];

    if (!tables[name]) tables[name] = [];
    tables[name].push(...vals);

    const escapedName = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp("@" + escapedName + "\\s*=\\s*.*");
    if (re.test(editor.value)) {
      editor.value = editor.value.replace(re, "@" + name + " = " + JSON.stringify(tables[name]));
    } else {
      editor.value += (editor.value && !editor.value.endsWith("\n") ? "\n" : "") + "@" + name + " = " + JSON.stringify(tables[name]);
    }
    updateHighlight();
  }

  else if (c.startsWith("Display")) {
    execLine(c);
  }

  else {
    output.textContent += `Unknown command: ${c}\n`;
  }
}

/* Init */
updateHighlight();
editor.focus();
</script>

</body>
</html>
